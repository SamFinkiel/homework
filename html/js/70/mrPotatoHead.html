<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Potato Head</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Mr. Potato Head</h1>
    <div id="container">
        <div id="sidebar">
            <!-- Here we have the peices of Mr Potato head-->
            <img class="part" src="eyes.png" alt="pic of eyes">
            <img class="part" src="hat.png" alt="pic of hat">
            <img class="part" src="mouth.png" alt="pic of mouth">
            <img class="part" src="nose.png" alt="pic of nose">
            <img class="part" src="leftEar.png" alt="pic of leftEar">
            <img class="part" src="rightEar.png" alt="pic of rightEar">
            <img class="part" src="leftFoot.png" alt="pic of leftFoot">
            <img class="part" src="rightFoot.png" alt="pic of rightFoot">
            <img class="part" src="leftHand.png" alt="pic of leftHand">
            <img class="part" src="rightHand.png" alt="pic of rightHand">

        </div>

        <div id="drawingSpace">
            <img id="head" src="head.png" alt="potato head">
        </div>
    </div>

    <audio id="music" src="music.mp3" loop></audio>
    <button id="musicButton">Play Music</button>

    <script type="module" src="mrPotatoHead.js"></script>
</body>

</html>
