<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #F7F3EC;
            color: #342D28;
            font-family: Georgia, serif;
            margin: 0;
            padding: 40px 20px;
        }

        #heading {
            font-family: Georgia, serif;
            font-size: 42px;
            font-weight: normal;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        #recipeSelectLbl {
            display: block;
            text-align: center;
            font-size: 14px;
            margin-bottom: 10px;
        }

        #recipeSelect {
            display: block;
            width: 100%;
            max-width: 360px;
            margin: 0 auto 35px;
            padding: 13px 15px;
            background-color: #FFFFFF;
            color: #342D28;
            border: 1px solid #D8CBBE;
            border-radius: 4px;
            font-size: 15px;
            font-family: Georgia, serif;
            cursor: pointer;
        }

        #recipeDetails {
            max-width: 850px;
            margin: 0 auto;
            padding: 35px;
            background-color: #FFFFFF;
            border: 1px solid #E8E0D6;
            box-shadow: 0 8px 25px rgba(52, 45, 40, 0.06);
            display: none;
        }

        #recipeDetails img {
            display: block;
            width: 100%;
            height: 350px;
            object-fit: contain;
            margin: 25px auto;
        }

        #ingredients {
            list-style: none;
            padding-left: 0;
        }

        @media (max-width: 600px) {
            #recipeDetails {
                padding: 20px;
            }

            h1 {
                font-size: 32px;
            }

            #recipeDetails img {
                height: 250px;
            }
        }
    </style>
</head>

<body>
    <h1 id="heading">Recipes</h1>

    <label for="recipeSelect" id="recipeSelectLbl">Choose a recipe:</label><br>
    <select id="recipeSelect">
        <option value="">Select a recipe</option>
    </select>

    <div id="recipeDetails">
        <h1 id="title"></h1>
        <h2 id="cookTime"></h2>
        <ul id="ingredients"></ul>
        <p id="instructions"></p>
        <img id="image">
    </div>

    <script src="recipe.js" type="module"></script>
</body>

</html>
